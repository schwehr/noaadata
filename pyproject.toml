[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noaadata"
version = "0.46"
description = "Encode/decode NOAA co-ops marine data and marine AIS"
readme = { file = "README", content-type = "text/plain" }
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [
    { name = "Kurt Schwehr", email = "schwehr@gmail.com" }
]
keywords = ["AIS", "binary messages", "NMEA"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: System :: Networking",
]

[project.optional-dependencies]
db = [
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
]
gis = [
    "lxml>=5.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-benchmark",
    "hypothesis",
    "hypofuzz",
    "ruff",
    "mdformat",
    "codespell",
    "ty",
    "mypy",
    "pyright",
    "pyrefly",
    "semgrep",
    "bandit",
    "mkdocs-material",
    "mkdocstrings[python]",
]

[tool.hatch.build.targets.wheel]
packages = [
    "noaadata",
    "ais",
    "aisutils",
    "nmea",
]

[project.scripts]
ais-5report = "noaadata.cli.ais_5report:main"
ais-bin-msgs = "noaadata.cli.ais_bin_msgs:main"
ais-build-postgis = "noaadata.cli.ais_build_postgis:main"
