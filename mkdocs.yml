site_name: noaadata
site_description: Encode/decode NOAA CO-OPS marine waterlevel data, marine AIS binary messages, USCG N-AIS receive fields, and NMEA-0183 marine sentences.
site_author: Kurt Schwehr

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            docstring_options:
              warn_unknown_params: false
              ignore_init_summary: true
            show_source: true
            show_root_heading: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Migration Guide: migration_guide.md
  - API Reference:
      - noaadata: api/noaadata.md
      - ais: api/ais.md
      - aisutils: api/aisutils.md
      - nmea: api/nmea.md
